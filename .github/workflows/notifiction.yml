name: notifiction
on:
  release:
    types: [published]

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
    - name: Discord Notifiction
      uses: tsickert/discord-webhook@v7.0.0
      with:
        webhook-url: ${{ secrets.WEBHOOK_URL }}
        content: |
          ## Layered Blend Mask Online Demo Update ${{ github.event.release.name }} :fire: 
          [Github Repository](https://github.com/Shaun-Fong/LayeredBlendMasks_Demo)
          [Online Demo Url](https://rengamesteam.github.io/LayeredBlendMaskDemo/)   
          ${{ github.event.release.body }}
